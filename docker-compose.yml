x-app-build: &app-build
  build:
    context: .
    args:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies pending migrations, then serves the application (Dockerfile).
  app:
    <<: *app-build
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Runs `npm run db:purge` once a day, from the same image as `app` so it
  # starts instantly instead of reinstalling dependencies every day. Waits
  # on `app` rather than `db` alone, so migrations have already run and the
  # schema it purges against exists.
  purge:
    <<: *app-build
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          npm run db:purge
          sleep 86400
        done

volumes:
  db-data:
