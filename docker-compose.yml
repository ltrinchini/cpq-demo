services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs `npm run db:purge` once a day. Interim: there is no application
  # image yet (see specs/007-demo-polish), so this installs the app straight
  # from the mounted source instead of building from a Dockerfile. 007
  # replaces this with the application image once one exists.
  purge:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - purge-node-modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        npm ci
        while true; do
          npm run db:purge
          sleep 86400
        done

volumes:
  db-data:
  purge-node-modules:
